services:
  nodo1:
    build: .
    image: autolote-api
    hostname: nodo1
    restart: unless-stopped
    ports: ["9001:9000"]
  nodo2:
    build: .
    image: autolote-api
    hostname: nodo2
    restart: unless-stopped
    ports: ["9002:9000"]
  nodo3:
    build: .
    image: autolote-api
    hostname: nodo3
    restart: unless-stopped
    ports: ["9003:9000"]

  servidor_web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    command: /bin/sh -c "mkdir -p /etc/nginx/ssl && apk add --no-cache openssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/nginx.key -out /etc/nginx/ssl/nginx.crt -subj '/CN=localhost' && nginx -g 'daemon off;'"
    depends_on:
      - nodo1
      - nodo2
      - nodo3